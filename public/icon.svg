<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="petalShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="0" stdDeviation="1.5" floodColor="#000000" floodOpacity="0.18" />
    </filter>
    <clipPath id="rightHalf">
      <rect x="0" y="-60" width="60" height="120" />
    </clipPath>
  </defs>
  <g transform="translate(50, 50)">
    <g transform="rotate(0)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#E32636" filter="url(#petalShadow)" /></g>
    <g transform="rotate(315)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#F38420" filter="url(#petalShadow)" /></g>
    <g transform="rotate(270)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#F9D423" filter="url(#petalShadow)" /></g>
    <g transform="rotate(225)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#7EC242" filter="url(#petalShadow)" /></g>
    <g transform="rotate(180)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#31B4D2" filter="url(#petalShadow)" /></g>
    <g transform="rotate(135)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#3553B8" filter="url(#petalShadow)" /></g>
    <g transform="rotate(90)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#9D32B2" filter="url(#petalShadow)" /></g>
    <g transform="rotate(45)"><path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#DFE0E2" filter="url(#petalShadow)" /></g>
    <g transform="rotate(0)" clip-path="url(#rightHalf)">
      <path d="M 0,0 C 11,-15 14,-30 14,-35 A 14 14 0 0 0 -14 -35 C -14,-30 -11,-15 0,0 Z" fill="#E32636" filter="url(#petalShadow)" />
    </g>
    <circle cx="0" cy="0" r="8.5" fill="#FFFFFF" />
  </g>
</svg>
